<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found | Startup Repair Store</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .card{max-width:480px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.12);padding:44px 34px}
    .code{font-size:64px;font-weight:800;background:linear-gradient(135deg,#1e3a8a,#2563eb,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:22px;margin:10px 0 8px}
    p{color:#64748b;font-size:15px;line-height:1.6;margin-bottom:24px}
    a{display:inline-block;background:#2563eb;color:#fff;font-weight:700;text-decoration:none;padding:12px 24px;border-radius:12px;transition:.2s}
    a:hover{background:#1d4ed8;transform:translateY(-2px)}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.<br/>Let's get you back to repairs &amp; deals.</p>
    <a href="index.html">← Back to Startup Repair Store</a>
  </div>
</body>
</html>
